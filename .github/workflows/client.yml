name: Client npm

# Gera o client TypeScript (pacote nippon-ten) a partir do schema OpenAPI e publica no npm.
# - Tag criada: publica a versão de nippon.client.version (application.properties) na tag "latest".
# - Manual (Actions > Client npm > Run workflow): publica snapshot por padrão, ou release se marcado.
on:
  push:
    tags: ["**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar como release (versão exata, tag latest) em vez de snapshot"
        type: boolean
        default: false

# Duas publicações ao mesmo tempo disputariam a mesma versão no npm.
concurrency:
  group: client-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Gera e publica o client
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configura o JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Configura o Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # O Quarkus grava target/openapi/openapi.yaml no build; os testes já rodam no CI.
      - name: Gera o schema OpenAPI
        run: ./mvnw -B -ntp package -DskipTests

      - name: Gera e publica o client
        id: client
        env:
          # Token de automação do npm, cadastrado em Settings > Secrets and variables > Actions.
          NODE_AUTH_TOKEN: ${{ secrets.NIPPON_TEN_NPM_KEY }}
          CLIENT_SNAPSHOT: ${{ (github.ref_type == 'tag' || inputs.release) && 'false' || 'true' }}
        run: |
          # Sem o token ainda cadastrado, a pipe só gera o client e o anexa como artefato.
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::warning::Secret NIPPON_TEN_NPM_KEY não configurado: o client foi gerado, mas não publicado."
            export CLIENT_PUBLISH=false
          fi
          ./scripts/build-client.sh

      - name: Resumo
        run: |
          echo "### Client nippon-ten@${{ steps.client.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag npm: \`${{ steps.client.outputs.dist-tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Anexa o client gerado
        uses: actions/upload-artifact@v4
        with:
          name: nippon-ten-client-${{ steps.client.outputs.version }}
          path: |
            target/openapi-clients/node-client
            !target/openapi-clients/node-client/node_modules
          retention-days: 7
