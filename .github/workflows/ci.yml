name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo na mesma branch/PR cancela a execução anterior, que já ficou obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Formatação e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configura o JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verifica a formatação (Spotless)
        run: ./mvnw -B -ntp spotless:check

      # Os testes @QuarkusTest sobem um Postgres efêmero via Dev Services (Testcontainers); o
      # runner ubuntu-latest já tem Docker disponível, então não precisa de service container.
      - name: Compila e roda os testes
        run: ./mvnw -B -ntp verify

      - name: Publica os relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
