quarkus.datasource.db-kind=postgresql

# Converte nomes de propriedades camelCase para colunas snake_case (ex: lastName -> last_name)
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Credenciais apenas do perfil de produção. Em dev elas vêm de application-dev.properties; em teste
# o Dev Services sobe um Postgres efêmero, por isso a url não pode estar definida aqui.
%prod.quarkus.datasource.username=${DB_USERNAME:}
%prod.quarkus.datasource.password=${DB_PASSWORD:}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL:}

# O schema é versionado pelo Flyway (src/main/resources/db/migration); o Hibernate só valida que as
# entidades batem com ele, em todos os perfis.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true

# Em dev o banco é descartável: limpa e recria a partir das migrations a cada subida.
# %dev.quarkus.flyway.clean-at-start=true

# Autenticação (JWT RS256). Em dev e test o smallrye-jwt gera um par de chaves a cada subida;
# em produção as chaves vêm de fora do repositório.
mp.jwt.verify.issuer=${JWT_ISSUER:nippon-ten}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
nippon.auth.access-token-ttl=PT15M
nippon.auth.refresh-token-ttl=P7D
# Cache da checagem de sessão e permissões feita a cada request. É invalidado na hora pelas
# mudanças de acesso; o TTL só vale para outras instâncias da API.
nippon.auth.session-cache-ttl=PT30S
nippon.auth.session-cache-max-size=10000
# Limite de logins que falham, por email e por IP, dentro da janela.
nippon.auth.login.max-failures-per-email=5
nippon.auth.login.max-failures-per-ip=20
nippon.auth.login.window=PT15M
# Fuso do restaurante: início e fim de combos e promoções são horários locais neste fuso.
nippon.business-zone=America/Sao_Paulo
# Primeiro super_admin, criado no startup se ainda não existir. Em dev e prod vêm das variáveis
# NIPPON_BOOTSTRAP_ADMIN_EMAIL e NIPPON_BOOTSTRAP_ADMIN_PASSWORD; não há senha padrão.
%test.nippon.bootstrap.admin.email=admin@nippon-ten.test
%test.nippon.bootstrap.admin.password=test-admin-password

# O front roda em outro site e manda o cookie de refresh (credentials), então as origens são
# explícitas, nunca "*".
# Endpoint sem @PermitAll, @Authenticated ou @RolesAllowed é negado.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# Esquema Bearer JWT no OpenAPI; os endpoints protegidos ganham o requisito automaticamente.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONT_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Requested-With
quarkus.http.cors.access-control-allow-credentials=true

# Pool Connection Settings
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.initial-size=5

# SQL Logging (useful for debugging Panache active record / repository queries)
# quarkus.hibernate-orm.log.sql=true
# quarkus.hibernate-orm.log.format-sql=true

quarkus.swagger-ui.path=/api

# Grava o schema OpenAPI no build (usado para gerar o cliente TypeScript em clients/typescript)
quarkus.smallrye-openapi.store-schema-directory=target/openapi
