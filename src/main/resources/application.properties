quarkus.datasource.db-kind=postgresql

# Converte nomes de propriedades camelCase para colunas snake_case (ex: lastName -> last_name)
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Credenciais apenas do perfil de produção. Em dev elas vêm de application-dev.properties; em teste
# o Dev Services sobe um Postgres efêmero, por isso a url não pode estar definida aqui.
%prod.quarkus.datasource.username=${DB_USERNAME:}
%prod.quarkus.datasource.password=${DB_PASSWORD:}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL:}

# O schema é versionado pelo Flyway (src/main/resources/db/migration); o Hibernate só valida que as
# entidades batem com ele, em todos os perfis.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true

# Em dev o banco é descartável: limpa e recria a partir das migrations a cada subida.
# %dev.quarkus.flyway.clean-at-start=true

# Autenticação (JWT RS256). Em dev e test o smallrye-jwt gera um par de chaves a cada subida;
# em produção as chaves vêm de fora do repositório.
mp.jwt.verify.issuer=${JWT_ISSUER:nippon-ten}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
nippon.auth.access-token-ttl=PT15M
nippon.auth.refresh-token-ttl=P7D
# Cache da checagem de sessão e permissões feita a cada request. É invalidado na hora pelas
# mudanças de acesso; o TTL só vale para outras instâncias da API.
nippon.auth.session-cache-ttl=PT30S
nippon.auth.session-cache-max-size=10000
# Limite de logins que falham, por email e por IP, dentro da janela.
nippon.auth.login.max-failures-per-email=5
nippon.auth.login.max-failures-per-ip=20
nippon.auth.login.window=PT15M
# Fuso do restaurante: início e fim de combos e promoções são horários locais neste fuso.
nippon.business-zone=America/Sao_Paulo
# Primeiro super_admin, criado no startup se ainda não existir. Em dev e prod vêm das variáveis
# NIPPON_BOOTSTRAP_ADMIN_EMAIL e NIPPON_BOOTSTRAP_ADMIN_PASSWORD; não há senha padrão.
%test.nippon.bootstrap.admin.email=admin@nippon-ten.test
%test.nippon.bootstrap.admin.password=test-admin-password

# O front roda em outro site e manda o cookie de refresh (credentials), então as origens são
# explícitas, nunca "*".
# Endpoint sem @PermitAll, @Authenticated ou @RolesAllowed é negado.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# Esquema Bearer JWT no OpenAPI; os endpoints protegidos ganham o requisito automaticamente.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONT_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Requested-With,X-Order-Token
quarkus.http.cors.access-control-allow-credentials=true

# Pagamento online (docs/payments.md). Token e assinatura secreta só por variável de ambiente; sem
# eles a aplicação sobe, mas a cobrança responde 502 e nenhum webhook é aceito.
quarkus.rest-client.mercadopago.url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
quarkus.rest-client.mercadopago.connect-timeout=5000
quarkus.rest-client.mercadopago.read-timeout=15000
nippon.payments.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
nippon.payments.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
# O mínimo que a API Orders aceita para o Pix.
nippon.payments.pix-expiration=PT30M
# Pedido online sem tentativa de pagamento aberta é cancelado depois deste prazo.
nippon.payments.awaiting-payment-timeout=PT30M
# Intervalo do job que vence Pix, busca aprovações perdidas e cancela pedidos abandonados. Em teste
# o scheduler fica desligado e os testes chamam a reconciliação direto.
nippon.payments.reconciliation-interval=60s
%test.quarkus.scheduler.enabled=false
# Token dos jobs disparados por HTTP (POST /jobs/..., docs/deploy.md). No Cloud Run o scheduler
# interno fica desligado (QUARKUS_SCHEDULER_ENABLED=false) e o Cloud Scheduler chama com este
# token. Vazio, nenhuma chamada é aceita.
nippon.jobs.token=${NIPPON_JOBS_TOKEN:}
%test.nippon.jobs.token=test-jobs-token
# Em teste o Mercado Pago é um stub local (src/test, MercadoPagoStub).
%test.nippon.test.mercadopago-stub-port=18089
%test.quarkus.rest-client.mercadopago.url=http://localhost:${nippon.test.mercadopago-stub-port}
%test.nippon.payments.mercadopago.access-token=TEST-access-token
%test.nippon.payments.mercadopago.webhook-secret=test-webhook-secret

# Taxa de entrega (docs/delivery.md). O CEP é consultado no ViaCEP, com a BrasilAPI de reserva, e
# a coordenada vem do Google Geocoding. Sem a chave do Google a aplicação sobe, mas a entrega com o
# cálculo ligado responde 400.
quarkus.rest-client.viacep.url=${VIACEP_BASE_URL:https://viacep.com.br}
quarkus.rest-client.viacep.connect-timeout=3000
quarkus.rest-client.viacep.read-timeout=5000
quarkus.rest-client.brasilapi.url=${BRASILAPI_BASE_URL:https://brasilapi.com.br}
quarkus.rest-client.brasilapi.connect-timeout=3000
quarkus.rest-client.brasilapi.read-timeout=5000
quarkus.rest-client.google-geocoding.url=${GOOGLE_GEOCODING_BASE_URL:https://maps.googleapis.com}
quarkus.rest-client.google-geocoding.connect-timeout=3000
quarkus.rest-client.google-geocoding.read-timeout=5000
nippon.delivery.google.api-key=${GOOGLE_MAPS_API_KEY:}
# O CEP muda pouco; vencido, é consultado de novo, e a cópia antiga vale se o provedor cair.
nippon.delivery.cep-cache-ttl=P90D
# Os termos do Google permitem guardar lat/lng por no máximo 30 dias. Com a limpeza diária, 29 dias
# de TTL mantêm cada linha abaixo disso.
nippon.delivery.geocode-cache-ttl=P29D
nippon.delivery.geocode-cache-purge-cron=0 0 4 * * ?
# Em teste os três provedores são um stub local (src/test, GeoStub).
%test.nippon.test.geo-stub-port=18090
%test.quarkus.rest-client.viacep.url=http://localhost:${nippon.test.geo-stub-port}/viacep
%test.quarkus.rest-client.brasilapi.url=http://localhost:${nippon.test.geo-stub-port}/brasilapi
%test.quarkus.rest-client.google-geocoding.url=http://localhost:${nippon.test.geo-stub-port}/google
%test.nippon.delivery.google.api-key=TEST-google-key

# E-mail de confirmação do pedido (docs/orders.md), por SMTP. Usuário e senha só por variável de
# ambiente. Em dev o mailer fica em modo mock (só loga a mensagem) até MAILER_MOCK=false; em teste é
# sempre mock e os testes leem a MockMailbox.
quarkus.mailer.from=${MAILER_FROM:}
quarkus.mailer.host=${MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAILER_PORT:587}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${MAILER_USERNAME:}
quarkus.mailer.password=${MAILER_PASSWORD:}
# Login com usuário e senha de app. Sem isso o Vert.x tenta XOAUTH2 primeiro com a senha, o Gmail
# recusa (535) e fecha a conexão antes de tentar PLAIN/LOGIN.
quarkus.mailer.auth-methods=PLAIN LOGIN
%dev.quarkus.mailer.mock=${MAILER_MOCK:true}
%test.quarkus.mailer.from=pedidos@nippon-ten.test
# Endereço do front, base do link de acompanhamento (<base>/pedido/<code>).
nippon.front.base-url=${FRONT_BASE_URL:http://localhost:5173}
# Reenvio do link de acompanhamento: pedidos por código do pedido e por IP dentro da janela.
nippon.orders.tracking-link.max-per-order=3
nippon.orders.tracking-link.max-per-ip=10
nippon.orders.tracking-link.window=PT15M

# Pool Connection Settings
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.initial-size=5

# SQL Logging (useful for debugging Panache active record / repository queries)
# quarkus.hibernate-orm.log.sql=true
# quarkus.hibernate-orm.log.format-sql=true

quarkus.swagger-ui.path=/api

# Versão do client npm (pacote nippon-ten). É lida pela pipe de publicação e pelos scripts em
# scripts/build-client.*; suba aqui antes de criar a tag de release. Vira também a versão do schema.
nippon.client.version=0.5.0-alpha
quarkus.smallrye-openapi.info-version=${nippon.client.version}

# Grava o schema OpenAPI no build (usado para gerar o cliente TypeScript em clients/typescript)
quarkus.smallrye-openapi.store-schema-directory=target/openapi
